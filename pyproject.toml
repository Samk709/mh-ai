[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mh-ai"
version = "0.1.0"
description = "AI-powered Mental Health Support System"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.34",
  "transformers>=4.41",
  "torch>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "passlib[bcrypt]>=1.7",
  "python-jose>=3.3",
  "redis>=5.0",
  "pandas>=2.2",
  "plotly>=5.22",
  "scikit-learn>=1.5",
  "shap>=0.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
