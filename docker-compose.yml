version: '3.9'
services:
  web:
    build: .
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/mhai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mhai
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
